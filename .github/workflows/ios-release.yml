name: Build iOS IPA

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - 'iosApp/**'
      - '.github/workflows/ios-release.yml'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Build Archive (Unsigned for Sideloading)
        run: |
          xcodebuild -project iosApp/Atify.xcodeproj \
            -scheme Atify \
            -configuration Release \
            -archivePath build/Atify.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/Atify.xcarchive/Products/Applications/Atify.app build/Payload/
          cd build
          zip -r -9 Atify.ipa Payload
          shasum -a 256 Atify.ipa | cut -d " " -f 1 > Atify.ipa.sha256
          echo "Generated IPA package:"
          ls -lh Atify.ipa Atify.ipa.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atify-iOS-ipa
          path: |
            build/Atify.ipa
            build/Atify.ipa.sha256
          retention-days: 14

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "Attaching Atify.ipa to release $TAG_NAME..."
          cd build
          # Wait up to 10 minutes for the Android release workflow to create the release
          for i in $(seq 1 60); do
            if gh release view "$TAG_NAME" --repo="${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "Release $TAG_NAME found! Uploading IPA..."
              gh release upload "$TAG_NAME" Atify.ipa Atify.ipa.sha256 --clobber --repo="${GITHUB_REPOSITORY}"
              exit 0
            fi
            echo "Waiting for release $TAG_NAME to be created by Android builder (attempt $i/60)..."
            sleep 10
          done
          echo "Fallback: release upload attempt..."
          gh release upload "$TAG_NAME" Atify.ipa Atify.ipa.sha256 --clobber --repo="${GITHUB_REPOSITORY}" || true
